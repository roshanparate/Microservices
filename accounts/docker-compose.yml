name: eazybank-microservices
services:
  accounts:
    image: "rmp1991/accounts:v1"
    container_name: accounts-ms
    restart: unless-stopped
    ports:
      - "8787:8787"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - eazybank

  loans:
    image: "rmp1991/loans:v1"
    container_name: loans-ms
    restart: unless-stopped
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - eazybank

  cards:
    image: "rmp1991/cards:v1"
    container_name: cards-ms
    restart: unless-stopped
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - eazybank

networks:
  eazybank:
    driver: bridge